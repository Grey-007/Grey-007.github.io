<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Grey's portfolio site featuring projects, socials, and current focus." />
  <title>Grey | Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loader" aria-hidden="true">
    <div class="loader-logo">G-007</div>
  </div>

  <div class="animated-bg" aria-hidden="true">
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-orb orb-c"></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#home">Grey-007</a>
      <nav>
        <a href="#home">Home</a>
        <a href="#projects">Projects</a>
        <a href="#socials">Socials</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="hero section-shell">
      <p class="eyebrow">Portfolio</p>
      <h1>Hi, I'm <span id="typing-name"></span></h1>
      <p class="hero-subtitle">Student | Linux enthusiast | Open-source learner</p>
      <p class="arch-btw">"I use <span>Arch</span> btw"</p>
      <a class="primary-cta" href="#projects">See Projects</a>
      <div class="scroll-indicator"></div>
    </section>

    <section id="projects" class="projects section-shell hidden-section">
      <div class="section-head">
        <h2>Projects</h2>
        <p>A selection of my favorite projects.</p>
      </div>
      <div class="carousel-wrapper">
        <div class="carousel-viewport">
          <div id="carousel-track" class="carousel-track"></div>
        </div>
        <div class="carousel-nav">
          <button id="prev-btn" class="carousel-arrow" aria-label="Previous project">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <button id="next-btn" class="carousel-arrow" aria-label="Next project">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section id="socials" class="socials section-shell hidden-section">
      <div class="section-head">
        <h2>Socials</h2>
        <p>Where to find me.</p>
      </div>
      <div class="social-links">
        <a href="https://github.com/Grey-007" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://x.com" target="_blank" rel="noopener noreferrer">X</a>
        <a href="https://discord.com" target="_blank" rel="noopener noreferrer">Discord</a>
        <a href="mailto:hello@example.com">Email</a>
      </div>
    </section>
  </main>

  <footer>© 2026 Grey</footer>

  <script src="script.js"></script>
</body>
</html>
